name: CMake Build and Test

on: 
  workflow_call:
    inputs:
      platform:
        description: Display name for the ROOT/OS validation target.
        required: true
        type: string
      root_image:
        description: Fully qualified ROOT container image.
        required: true
        type: string

jobs:
  build-and-test:
    name: Build and Test (${{ inputs.platform }})
    
    if: >
      (github.actor == github.repository_owner) || 
      (github.event_name == 'pull_request' && github.event.label.name == 'run-tests')
      
    
    runs-on: ubuntu-latest
    
    container:
      image: ${{ inputs.root_image }}

    steps:
    - name: Reset run-test label
      if: github.event_name == 'pull_request'
      uses: actions-ecosystem/action-remove-labels@v1
      with:
        labels: 'run-tests'
      continue-on-error: true
    
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: CMake configuration
      run: |
        mkdir build
        cmake -S . -B build

    - name: Compile WaveDeck
      run: |
        cmake --build build

    - name: Run Unit Tests
      run: ctest --test-dir build -E "ExampleTest" --output-on-failure

    - name: Run Example Test
      run: ctest --test-dir build -R "ExampleTest" --output-on-failure
      env:
        CI: "true"

    - name: Upload Plot Artifacts
      uses: actions/upload-artifact@v4
      if: success() 
      with:
        name: output-plots-${{ inputs.platform }}
        path: build/examples_output_plots/*.png
        if-no-files-found: error
        retention-days: 5
