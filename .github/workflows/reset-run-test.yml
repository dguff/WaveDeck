name: Reset run-tests label

on:
  pull_request_target:
    types: [labeled]

permissions:
  pull-requests: write

jobs:
  remove-label:
    if: github.event.label.name == 'run-tests'
    runs-on: ubuntu-latest

    steps:
      - name: Remove one-shot label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: run-tests
