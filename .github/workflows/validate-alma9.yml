name: CI Alma9 Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-tests'
    uses: ./.github/workflows/cmake_test.yml
    with:
      platform: alma9-root6.30.02
      root_image: rootproject/root:6.30.02-alma9

